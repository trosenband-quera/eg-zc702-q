syntax = "proto3";
// option optimize_for = LITE_RUNTIME;

package iq_proto;


enum iq_message_type {
    PLOT_DATA = 0; // Default value
    CHANNEL_INFO = 1;
}

enum iq_commands {
    RUN = 0; // Default value
    STOP = 1;
}

message channelInfo {
   string name = 1;
   float scale = 2;
   bool bipolar = 3;
   int32 width = 4;
   float min = 5;
   float max = 6;
   int32 index = 7;
}

message plotData {
    repeated float values = 1;
    repeated channelInfo ch_info = 2;
}

message iq_command {
    iq_commands cmd = 1;
}

message demodulator_config {
    optional int32 ref = 1;
    optional int32 quiet = 2;
    optional int32 nmax = 3;
}

